
name: Atualizar Vitrine automaticamente

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vitrine-auto-update
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar atualizacoes originais
        run: |
          git remote add upstream https://github.com/My-Name-Is-Jeff/vitrine.git
          git fetch upstream main

      - name: Sincronizar sem sobrescrever conflitos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --ff-only upstream/main
          git push origin HEAD:main

    